<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Peça — Manutenção CGS</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/componentes.css">
    <link rel="stylesheet" href="../css/views/movimentar.css">
    <link rel="stylesheet" href="../css/colaborador.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="layout">
        <header class="mobile-topbar">
            <button class="btn-abrir-sidebar" id="btn-abrir-sidebar" aria-label="Abrir menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="logo-badge">
                <img src="../assets/img/grupo-boticario.svg" alt="Logotipo Grupo Boticário">
            </div>
            <span class="logo-texto">Manutenção<strong>CGS</strong></span>
        </header>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-badge">
                    <img src="../assets/img/grupo-boticario.svg" alt="Logotipo Grupo Boticário">
                </div>
                <span class="logo-texto">Manutenção<strong>CGS</strong></span>
                <button class="btn-fechar-sidebar" id="btn-fechar-sidebar" aria-label="Fechar menu">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <ul class="sidebar-nav">
                <li>
                    <a href="dashboard.html" class="sidebar-link">
                        <i class="fa-solid fa-gauge"></i>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="estoque.html" class="sidebar-link">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        Estoque
                    </a>
                </li>
                <li>
                    <a href="adicionar.html" class="sidebar-link ativo">
                        <i class="fa-solid fa-square-plus"></i>
                        Adicionar
                    </a>
                </li>
                <li>
                    <a href="retirar.html" class="sidebar-link">
                        <i class="fa-solid fa-square-minus"></i>
                        Retirar
                    </a>
                </li>
                <li>
                    <a href="movimentacao.html" class="sidebar-link">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        Movimentação
                    </a>
                </li>
            </ul>
        </nav>

        <div class="conteudo">
            <div id="app-status" class="status-msg" style="display:none;"></div>

            <div class="colaborador-banner">
                <span class="colaborador-banner-texto">Operando como: <strong id="colaborador-nome-ativo">—</strong></span>
                <button class="btn-trocar-colaborador" id="btn-trocar-colaborador">Trocar</button>
            </div>

            <div class="adicionar">
                <header class="movimentar-header">
                    <h1>Adicionar Peça</h1>
                    <p class="dashboard-subtitulo">Registrar entrada de peças no estoque</p>
                </header>

                <div class="movimentar-card">
                    <div class="movimentar-produto-busca">
                        <label for="busca-produto">Buscar produto:</label>
                        <input type="text" id="busca-produto" placeholder="Digite descrição, código ou posição...">
                        <div id="resultados-busca" class="resultados-busca"></div>
                    </div>

                    <div class="produto-selecionado-card" id="produto-selecionado-card">
                        <div class="produto-selecionado-info">
                            <span class="produto-selecionado-descricao" id="ps-descricao"></span>
                            <span class="produto-selecionado-detalhes" id="ps-detalhes"></span>
                        </div>
                        <div class="produto-selecionado-quantidade-atual">
                            Qtd. atual
                            <strong id="ps-quantidade-atual">--</strong>
                        </div>
                    </div>

                    <form id="form-movimentacao">
                        <div class="form-group">
                            <label for="quantidade-movimentar">Quantidade a adicionar:</label>
                            <input type="number" id="quantidade-movimentar" min="1" required>
                        </div>

                        <div class="quick-qtd-buttons">
                            <button type="button" data-qtd="1">+1</button>
                            <button type="button" data-qtd="5">+5</button>
                            <button type="button" data-qtd="10">+10</button>
                        </div>

                        <div id="aviso-movimentacao" class="aviso-movimentacao"></div>

                        <button type="submit" id="btn-confirmar-movimentacao" class="btn-primario btn-entrada-full">
                            Registrar entrada
                        </button>
                    </form>

                    <div id="mensagem-sucesso" class="mensagem-sucesso"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-colaborador" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Quem é você?</h2>
            </div>
            <select id="select-colaborador">
                <option value="">Carregando...</option>
            </select>
            <div class="modal-actions">
                <button type="button" class="btn-acao btn-editar" id="btn-confirmar-colaborador" style="width: auto; padding: 0.65rem 1.5rem;">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/colaborador.js"></script>
    <script src="../js/produto-busca.js"></script>
    <script src="../js/adicionar.js"></script>
</body>
</html>
